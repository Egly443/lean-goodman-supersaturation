name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create on main, for example v0.1.0"
        required: true
      notes:
        description: "Release notes"
        required: true
      target:
        description: "Commit SHA on main to tag (default: the current main commit)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          TARGET: ${{ inputs.target }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like v1.2.3, got: $VERSION"
            exit 1
          fi
          if [[ -z "$TARGET" ]]; then
            TARGET="$GITHUB_SHA"
          elif [[ ! "$TARGET" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "Target must be a commit SHA, got: $TARGET"
            exit 1
          fi
          TARGET="$(git rev-parse --verify "$TARGET^{commit}")"
          if ! git merge-base --is-ancestor "$TARGET" "$GITHUB_SHA"; then
            echo "Target $TARGET is not on main"
            exit 1
          fi
          gh release create "$VERSION" --target "$TARGET" --title "$VERSION" --notes "$NOTES"
